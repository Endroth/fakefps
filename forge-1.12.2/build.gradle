plugins {
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
}

version = '1.1.0'
group = 'dev.fpsfake'
base { archivesName = 'fpsfake-forge-1.12.2' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

loom {
    forge {
        pack200Provider.set(new dev.architectury.pack200.java.Pack200Adapter())
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.12.2'
    mappings 'de.oceanlabs.mcp:mcp_stable:39-1.12'
    forge 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}
