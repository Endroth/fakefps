name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: forge-1.8.9,    java: 17, gradle: 7.5.1 }
          - { dir: forge-1.16.5,   java: 8,  gradle: 7.6.4 }
          - { dir: forge-1.20.1,   java: 17, gradle: 8.1.1 }
          - { dir: fabric-1.16.5,  java: 17, gradle: 8.8 }
          - { dir: fabric-1.20.1,  java: 17, gradle: 8.8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/*.jar

  build-forge-1_12_2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Instalar Gradle 5.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-5.6.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-5.6.4/bin" >> $GITHUB_PATH
      - name: Build
        working-directory: forge-1.12.2
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: forge-1.12.2
          path: forge-1.12.2/build/libs/*.jar
